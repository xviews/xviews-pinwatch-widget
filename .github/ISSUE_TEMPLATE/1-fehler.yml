name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Je genauer die Angaben, desto schneller lässt sich der Fehler finden.
        Bitte keine persönlichen Daten (Passwörter, Codes, Kennzeichen o. Ä.) eintragen.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen passiert? Fehlermeldungen bitte wörtlich einfügen.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Wie lässt sich der Fehler nachstellen?
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: input
    id: version
    attributes:
      label: Version von Xviews PinWatch Widget
      description: Rechtsklick auf das Bridge-Symbol im Infobereich, dann „Über Xviews PinWatch“.
      placeholder: z. B. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
        - Anderes
    validations:
      required: true
  - type: input
    id: icue
    attributes:
      label: iCUE-Version
      placeholder: z. B. 5.47
  - type: input
    id: wireview
    attributes:
      label: WireView-Firmware
      description: Steht im Widget auf der Seite Gerät.
  - type: textarea
    id: bridge
    attributes:
      label: Zustand der Bridge
      description: Symbol im Infobereich grün oder grau? Was zeigt das Widget an?
  - type: textarea
    id: bilder
    attributes:
      label: Screenshots oder Fotos
      description: Gern per Drag & Drop hier hineinziehen.
